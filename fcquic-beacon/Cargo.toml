[package]
name = "fcquic-beacon"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio-fcquiche = { path = "../../multicast-quic/tokio-fcquiche", features=[ "qlog" ] }
tokio-quiche = { path = "../../multicast-quic/tokio-quiche" }
quiche = { path = "../../multicast-quic/quiche" }
env_logger = "0.11.8"
log = "0.4.34"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
tokio = { version = "1.53.3", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
url = "2.5.8"
chrono = "0.4.45"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = { version = "0.4.3", features = ["serde"] }
