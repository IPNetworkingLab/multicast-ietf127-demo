[package]
name = "qlog-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
log = "0.4.35"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
